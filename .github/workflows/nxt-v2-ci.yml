name: NXT Analytics - Feature validation
on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - name: Verify production assets
        run: |
          test -f dist/index.html
          test -f dist/icons/sprite.svg
          test -f dist/icons/network.svg
          test -f dist/nxt-logo.png
          test -f dist/nxt-intelligence.webp
      - name: Upload review build
        uses: actions/upload-artifact@v4
        with:
          name: nxt-analytics-preview
          path: dist/
          retention-days: 7