name: NXT v1.2 synthetic model and client graph validation (one-time)
on:
  push:
    branches: ['feat/nxt-intelligence-analysis-playbook-v12']
    paths: ['.github/workflows/nxt-playbook-v12-smoke.yml']
permissions:
  contents: read
  id-token: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Verify a real model-generated synthetic graph using the production transaction engine
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {applyAssistantPlan} from './src/core/assistant.ts';
          import {nodeFor} from './src/core/graph.ts';
          import {effectiveFilters} from './src/core/filters.ts';
          const endpoint='https://maqyirapxoygcsljdqyk.supabase.co/functions/v1/nxt-intelligence-smoke';
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience','nxt-playbook-v12-smoke');
          const id=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          assert.ok(id.ok,'OIDC request failed');
          const token=(await id.json()).value;
          const result=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(145000)});
          const data=await result.json();
          console.log(JSON.stringify({status:result.status,ok:data.ok===true,stage:data.stage,cleaned:data.cleaned,operationCount:data.plan?.operations?.length,usage:data.usage}));
          assert.ok(result.ok&&data.ok&&data.cleaned,'synthetic model test failed');
          const state={nodes:[nodeFor({id:'test:root',parentId:null,label:'Synthetic root',kind:'root',createdBy:'user',metricId:'otifRate'},{x:0,y:0})],edges:[],globals:[{id:'g',field:'delivery_year',op:'eq',value:'2018'}],locals:{'test:root':[{id:'f',field:'factory',op:'eq',value:'Synthetic factory'}]},dashboards:{'test:root':{question:'',widgets:[]}},selectedId:'test:root',allowedFields:['factory','product_type','delivery_year']};
          const next=applyAssistantPlan(state,data.plan);
          const groups=next.nodes.filter(n=>n.data.analysis.kind==='container');
          assert.equal(groups.length,1);const group=groups[0];
          const members=next.nodes.filter(n=>n.data.analysis.containerId===group.id);
          assert.equal(members.length,2);assert.equal(next.edges.length,1);assert.equal(next.edges[0].source,'test:root');assert.equal(next.edges[0].target,group.id);
          assert.deepEqual(members.map(n=>n.data.analysis.visualization).sort(),['heatmap','line']);
          for(const n of members){assert.ok(next.dashboards[n.id].question);assert.ok(next.dashboards[n.id].widgets.length>=2);assert.deepEqual(effectiveFilters(next.globals,next.nodes.map(x=>x.data.analysis),next.locals,n.id,next.edges).map(f=>f.value),['2018','Synthetic factory']);}
          assert.equal(state.nodes.length,1);assert.equal(state.edges.length,0);assert.notEqual(members[0].position.x,members[1].position.x);
          console.log('Model plan executed: one group arrow, two separate real canvas charts, live dashboard definitions, inherited context, compact layout, original draft unchanged.');
          NODE
