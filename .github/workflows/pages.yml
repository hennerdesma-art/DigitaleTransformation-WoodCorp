name: Deploy NXT Analytics to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check graph and filter logic
        run: npm run test
      - name: Build React website
        run: npm run build
      - name: Verify static assets
        run: |
          test -f dist/index.html
          test -f dist/icons/sprite.svg
          test -f dist/nxt-logo.png
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
