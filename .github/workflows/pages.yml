name: Deploy NXT Analytics to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax\n        run: |\n          node --check js/config.js\n          node --check js/filters.js\n          node --check js/app.js\n      - name: Test filter inheritance\n        run: node --test tests/filter-engine.test.cjs\n      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static NXT app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
