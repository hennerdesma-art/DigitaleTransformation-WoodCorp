name: Deploy NXT Analytics to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check graph and filter logic
        run: npm run test
      - name: Build React website
        run: npm run build
      - name: Verify static assets
        run: |
          test -f dist/index.html
          test -f dist/icons/sprite.svg
          test -f dist/nxt-logo.png
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled website
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist/
      # Artifact upload can finish before the Actions REST API lists the new artifact.
      # A unique per-attempt name prevents stale artifacts from earlier retries matching.
      - name: Wait for the exact Pages artifact to be visible
        shell: bash
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_ARTIFACT_ID"
          for attempt in $(seq 1 24); do
            if result=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f "name=$PAGES_ARTIFACT_NAME" 2>/dev/null); then
              if jq -e --arg id "$EXPECTED_ARTIFACT_ID" --arg name "$PAGES_ARTIFACT_NAME" '(.artifacts | length) == 1 and (.artifacts[0] | (.id | tostring) == $id and .name == $name and .expired == false)' <<< "$result" >/dev/null; then
                echo "Verified unique Pages artifact: $PAGES_ARTIFACT_NAME (ID $EXPECTED_ARTIFACT_ID)"
                exit 0
              fi
            fi
            echo "Pages artifact is not yet visible (attempt $attempt/24)."
            sleep 5
          done
          echo "::error::Expected Pages artifact did not become visible. Deployment was not attempted."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
