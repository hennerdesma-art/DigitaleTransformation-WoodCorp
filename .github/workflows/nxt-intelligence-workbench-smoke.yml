name: NXT Intelligence authenticated integration test (one-time)
on:
  push:
    branches: ['feat/nxt-intelligence-workbench-admin']
    paths: ['.github/workflows/nxt-intelligence-workbench-smoke.yml']
permissions:
  contents: read
  id-token: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify authenticated Copilot, policy enforcement and real Bedrock response
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://maqyirapxoygcsljdqyk.supabase.co/functions/v1/';
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience','nxt-intelligence-workbench-smoke');
          const id=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!id.ok)throw Error('OIDC request failed: '+id.status);
          const token=(await id.json()).value;
          if(!token)throw Error('OIDC token unavailable');
          const test=await fetch(base+'nxt-intelligence-smoke',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(140000)});
          const result=await test.json();
          console.log(JSON.stringify({status:test.status,ok:result.ok===true,stage:result.stage,checks:result.checks,cleaned:result.cleaned,operationCount:result.operationCount}));
          if(!test.ok||!result.ok||!result.cleaned||result.operationCount!==1)throw Error('Intelligence end-to-end test failed');
          NODE
