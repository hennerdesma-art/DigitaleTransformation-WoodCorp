name: NXT Bedrock synthetic live test (fixed EU profile)
on:
  push:
    branches: ['feat/nxt-intelligence-copilot']
    paths: ['.github/workflows/nxt-bedrock-smoke.yml']
permissions:
  contents: read
  id-token: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke isolated EU Bedrock smoke test using GitHub OIDC
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://maqyirapxoygcsljdqyk.supabase.co/functions/v1/';
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience','nxt-bedrock-smoke');
          const id=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!id.ok)throw Error('OIDC request failed: '+id.status);
          const token=(await id.json()).value;
          if(!token)throw Error('OIDC token unavailable');
          const blocked=await fetch(base+'nxt-intelligence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status'})});
          if(blocked.status!==401&&blocked.status!==403)throw Error('Unauthenticated production endpoint not rejected: '+blocked.status);
          console.log('Production endpoint denies anonymous requests.');
          const test=await fetch(base+'nxt-intelligence-smoke',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(135000)});
          const result=await test.json();
          console.log(JSON.stringify({status:test.status,ok:result.ok===true,stage:result.stage,providerStatus:result.providerStatus,model:result.model,region:result.region,operations:result.operations,usage:result.usage,enabled:result.enabled}));
          if(!test.ok||!result.ok||result.operations!==1)throw Error('Bedrock synthetic structured plan test failed');
          NODE
